name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Test
        run: |
          go -C src vet ./...
          go -C src test -count=1 ./...

      - name: Build linux/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go -C src build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o ../check-mk-passive-agent-linux-amd64 .
          sha256sum check-mk-passive-agent-linux-amd64 > check-mk-passive-agent-linux-amd64.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: check-mk-passive-agent-linux-amd64
          path: |
            check-mk-passive-agent-linux-amd64
            check-mk-passive-agent-linux-amd64.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes check-mk-passive-agent-linux-amd64 check-mk-passive-agent-linux-amd64.sha256
